<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - BOI Car Storage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div style="font-size:3.5rem; color: var(--primary);">
          <i class="bi bi-key"></i>
        </div>
        <h1>CHOOSE A NEW<br>PASSWORD</h1>
      </div>

      <div id="noToken" class="alert alert-danger d-none">
        This reset link is missing its token. <a href="/portal/forgot-password.html">Request a new one</a>.
      </div>

      <form id="resetForm">
        <div class="mb-2">
          <label class="form-label">New password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" placeholder="At least 8 characters" minlength="8" required autofocus>
            <button class="btn btn-outline-secondary" type="button" id="togglePass">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm password</label>
          <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
        </div>
        <div id="formError" class="alert alert-danger d-none"></div>
        <div id="formSuccess" class="alert alert-success d-none"></div>
        <button type="submit" class="btn w-100 btn-lg" id="submitBtn" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; font-weight: 700;">
          <i class="bi bi-check-circle me-2"></i>Reset Password
        </button>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('noToken').classList.remove('d-none');
      document.getElementById('resetForm').classList.add('d-none');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('formError');
      const okEl = document.getElementById('formSuccess');
      errEl.classList.add('d-none');
      okEl.classList.add('d-none');

      if (password !== confirmPassword) {
        errEl.textContent = 'Passwords do not match';
        errEl.classList.remove('d-none');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';

      try {
        const res = await fetch('/api/customer-auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (res.ok) {
          okEl.textContent = 'Password updated! Redirecting to sign in...';
          okEl.classList.remove('d-none');
          document.getElementById('resetForm').classList.add('d-none');
          setTimeout(() => { window.location.href = '/portal/login.html'; }, 1800);
        } else {
          errEl.textContent = data.error || 'Reset failed';
          errEl.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Reset Password';
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Reset Password';
      }
    });

    document.getElementById('togglePass').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const icon = document.querySelector('#togglePass i');
      if (pw.type === 'password') { pw.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { pw.type = 'password'; icon.className = 'bi bi-eye'; }
    });
  </script>
</body>
</html>
