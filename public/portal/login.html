<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - BOI Car Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --color-bg:#161826; --color-surface:#232532; --color-text:#e9e9ed;
    --color-accent:#9184d9; --color-accent-300:#d2cefd;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --font-heading:"Inter",system-ui,sans-serif; --font-heading-weight:500; --font-body:"Inter",system-ui,sans-serif;
    --radius-md:8px; --radius-lg:14px;
    --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh;}
  ::selection{background:color-mix(in srgb, var(--color-accent) 30%, transparent);}
  a{color:var(--color-accent);text-decoration:none;}
  a:hover{color:var(--color-accent-300);}
  input:focus-visible{outline:2px solid var(--color-accent);outline-offset:0}

  .field-label{display:block;font-size:12px;margin-bottom:5px;opacity:.7}
  .field-input{width:100%;min-height:36px;padding:8px 10px;font-size:14px;color:var(--color-text);background:var(--color-bg);border:1px solid var(--color-divider);border-radius:var(--radius-md)}
  .tab-btn{flex:1;font-family:var(--font-heading);font-weight:500;font-size:13px;padding:10px 0;border:0;cursor:pointer;}
  .tab-btn.active{background:color-mix(in srgb, var(--color-accent) 16%, transparent);color:var(--color-accent);}
  .tab-btn.inactive{background:transparent;color:var(--color-text);opacity:.7;}
  .submit-btn{width:100%;margin-top:6px;font-family:var(--font-heading);font-weight:500;font-size:15px;color:var(--color-accent);background:transparent;border:1px solid var(--color-accent);border-radius:var(--radius-md);padding:12px;cursor:pointer}
  .submit-btn:disabled{opacity:.6;cursor:default}
  .form-error{font-size:13px;color:#f2a4a4;background:color-mix(in srgb, #f2a4a4 12%, transparent);border:1px solid color-mix(in srgb, #f2a4a4 30%, transparent);border-radius:var(--radius-md);padding:10px 12px;margin:0}
</style>
</head>
<body>

<div style="max-width:1280px;margin:0 auto;padding:22px 48px">
  <a href="/portal/landing.html" style="font-size:14px;opacity:.8">&larr; Back to BOI Car Storage</a>
</div>

<div style="display:flex;justify-content:center;padding:40px 24px 80px">
  <div style="width:100%;max-width:420px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:36px 34px">
    <div style="font-family:var(--font-heading);font-weight:500;font-size:18px;margin-bottom:6px">BOI Car Storage</div>
    <p style="font-size:13px;opacity:.65;margin:0 0 28px">Kerikeri, Bay of Islands</p>

    <div style="display:inline-flex;width:100%;border:1px solid var(--color-divider);border-radius:var(--radius-md);overflow:hidden;margin-bottom:26px">
      <button type="button" id="tab-signin" class="tab-btn active">Sign in</button>
      <button type="button" id="tab-register" class="tab-btn inactive">Create account</button>
    </div>

    <form id="authForm">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div id="registerFields" style="display:none;flex-direction:column;gap:16px">
          <div>
            <label class="field-label">Full name</label>
            <input type="text" id="fullName" class="field-input" placeholder="Jamie Ngata" autocomplete="name">
          </div>
          <div>
            <label class="field-label">Phone</label>
            <input type="tel" id="phone" class="field-input" placeholder="021 234 5678" autocomplete="tel">
          </div>
        </div>
        <div>
          <label class="field-label">Email</label>
          <input type="email" id="email" class="field-input" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div>
          <label class="field-label">Password</label>
          <input type="password" id="password" class="field-input" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div id="formError" class="form-error" style="display:none"></div>

        <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
        <p id="forgotWrap" style="font-size:12px;text-align:right;margin:-8px 0 0">
          <a href="/portal/forgot-password.html">Forgot password?</a>
        </p>
      </div>
    </form>
  </div>
</div>

<script>
  let mode = 'signin';
  const tabSignIn = document.getElementById('tab-signin');
  const tabRegister = document.getElementById('tab-register');
  const registerFields = document.getElementById('registerFields');
  const submitBtn = document.getElementById('submitBtn');
  const forgotWrap = document.getElementById('forgotWrap');
  const errEl = document.getElementById('formError');

  function render() {
    const isRegister = mode === 'register';
    tabSignIn.className = 'tab-btn ' + (isRegister ? 'inactive' : 'active');
    tabRegister.className = 'tab-btn ' + (isRegister ? 'active' : 'inactive');
    registerFields.style.display = isRegister ? 'flex' : 'none';
    document.getElementById('fullName').required = isRegister;
    forgotWrap.style.display = isRegister ? 'none' : 'block';
    submitBtn.textContent = isRegister ? 'Create account' : 'Sign in';
    errEl.style.display = 'none';
  }
  tabSignIn.addEventListener('click', () => { mode = 'signin'; render(); });
  tabRegister.addEventListener('click', () => { mode = 'register'; render(); });
  render();

  fetch('/api/customer-auth/me', { credentials: 'include' }).then((r) => {
    if (r.ok) window.location.href = '/portal/home.html';
  }).catch(() => {});

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.style.display = 'none';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const isRegister = mode === 'register';

    let payload, url;
    if (isRegister) {
      const nameParts = document.getElementById('fullName').value.trim().split(/\s+/);
      if (nameParts.length < 2 || !nameParts[0] || !nameParts[1]) {
        errEl.textContent = 'Enter your full name (first and last)';
        errEl.style.display = 'block';
        return;
      }
      payload = {
        firstName: nameParts[0],
        lastName: nameParts.slice(1).join(' '),
        phone: document.getElementById('phone').value,
        email, password,
      };
      url = '/api/customer-auth/register';
    } else {
      payload = { email, password };
      url = '/api/customer-auth/login';
    }

    submitBtn.disabled = true;
    const originalLabel = submitBtn.textContent;
    submitBtn.textContent = isRegister ? 'Creating account...' : 'Signing in...';

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/portal/home.html';
      } else {
        errEl.textContent = data.error || (isRegister ? 'Could not create account' : 'Invalid email or password');
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }
    } catch (err) {
      errEl.textContent = 'Connection error. Please try again.';
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
  });
</script>
</body>
</html>
