<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - BOI Car Storage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card" style="max-width:480px;">
      <div class="login-logo">
        <div style="font-size:3.5rem; color: var(--primary);">
          <i class="bi bi-p-square-fill"></i>
        </div>
        <h1>CREATE YOUR<br>ACCOUNT</h1>
        <p>BOI Car Storage customer portal</p>
      </div>

      <form id="registerForm">
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">First name</label>
            <input type="text" class="form-control" id="firstName" required autofocus>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">Last name</label>
            <input type="text" class="form-control" id="lastName" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" id="phone" placeholder="021 000 0000">
        </div>
        <div class="mb-2">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" placeholder="At least 8 characters" minlength="8" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePass">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-4">
          <div class="form-text">Minimum 8 characters.</div>
        </div>
        <div id="registerError" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn w-100 btn-lg" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; font-weight: 700;">
          <i class="bi bi-person-plus me-2"></i>Create Account
        </button>
      </form>

      <p class="text-muted text-center mt-3 small">
        Already have an account? <a href="/portal/login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch('/api/customer-auth/me', { credentials: 'include' }).then(r => {
      if (r.ok) window.location.href = '/portal/home.html';
    }).catch(() => {});

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
      };
      const errEl = document.getElementById('registerError');
      errEl.classList.add('d-none');

      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

      try {
        const res = await fetch('/api/customer-auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          credentials: 'include'
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/portal/home.html';
        } else {
          errEl.textContent = data.error || 'Registration failed';
          errEl.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
      }
    });

    document.getElementById('togglePass').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const icon = document.querySelector('#togglePass i');
      if (pw.type === 'password') { pw.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { pw.type = 'password'; icon.className = 'bi bi-eye'; }
    });
  </script>
</body>
</html>
