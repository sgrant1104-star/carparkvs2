<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - BOI Car Storage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div style="font-size:3.5rem; color: var(--primary);">
          <i class="bi bi-key"></i>
        </div>
        <h1>RESET YOUR<br>PASSWORD</h1>
        <p>We'll email you a reset link</p>
      </div>

      <form id="forgotForm">
        <div class="mb-4">
          <label class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required autofocus>
          </div>
        </div>
        <div id="formError" class="alert alert-danger d-none"></div>
        <div id="formSuccess" class="alert alert-success d-none"></div>
        <button type="submit" class="btn w-100 btn-lg" id="submitBtn" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; font-weight: 700;">
          <i class="bi bi-send me-2"></i>Send Reset Link
        </button>
      </form>

      <p class="text-muted text-center mt-3 small">
        <a href="/portal/login.html">Back to sign in</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const errEl = document.getElementById('formError');
      const okEl = document.getElementById('formSuccess');
      errEl.classList.add('d-none');
      okEl.classList.add('d-none');

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

      try {
        const res = await fetch('/api/customer-auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (res.ok) {
          okEl.textContent = data.message || 'If an account exists for that email, a reset link has been sent.';
          okEl.classList.remove('d-none');
          document.getElementById('forgotForm').querySelector('input').value = '';
        } else {
          errEl.textContent = data.error || 'Something went wrong';
          errEl.classList.remove('d-none');
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send me-2"></i>Send Reset Link';
      }
    });
  </script>
</body>
</html>
