<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - BOI Car Storage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <style>
    .portal-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      padding: 1.25rem 1.5rem;
    }
    .portal-body { max-width: 640px; margin: 2.5rem auto; padding: 0 1rem; }
  </style>
</head>
<body>
  <div class="portal-header d-flex justify-content-between align-items-center">
    <div><i class="bi bi-p-square-fill me-2"></i><strong>BOI Car Storage</strong></div>
    <button class="btn btn-sm btn-outline-light" id="btn-logout">
      <i class="bi bi-box-arrow-right me-1"></i>Sign out
    </button>
  </div>

  <div class="portal-body">
    <div class="card shadow-sm mb-3">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <div>
            <h4 class="mb-1">Welcome, <span id="customer-name">…</span></h4>
            <p class="text-muted mb-0" id="customer-email"></p>
          </div>
          <a href="/portal/book.html" class="btn btn-lg" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; font-weight: 700;">
            <i class="bi bi-calendar-plus me-2"></i>Book Parking
          </a>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3"><i class="bi bi-clock-history me-2"></i>Your Bookings</h5>
        <div id="bookings-list" class="text-muted">Loading…</div>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function statusBadge(status) {
      const map = {
        pending: 'bg-warning text-dark',
        allocated: 'bg-info text-dark',
        completed: 'bg-success',
        auto_cancelled: 'bg-secondary',
      };
      const label = { pending: 'Pending', allocated: 'Allocated', completed: 'Completed', auto_cancelled: 'Auto-cancelled' }[status] || status;
      return `<span class="badge ${map[status] || 'bg-secondary'}">${label}</span>`;
    }

    fetch('/api/customer-auth/me', { credentials: 'include' }).then(async (r) => {
      if (!r.ok) { window.location.href = '/portal/login.html'; return; }
      const c = await r.json();
      document.getElementById('customer-name').textContent = `${c.firstName} ${c.lastName}`;
      document.getElementById('customer-email').textContent = c.email;
      loadBookings();
    }).catch(() => { window.location.href = '/portal/login.html'; });

    async function loadBookings() {
      const el = document.getElementById('bookings-list');
      try {
        const res = await fetch('/api/bookings/mine', { credentials: 'include' });
        if (!res.ok) { el.textContent = 'Could not load bookings.'; return; }
        const bookings = await res.json();
        if (bookings.length === 0) {
          el.innerHTML = '<span class="text-muted">No bookings yet — click "Book Parking" above to get started.</span>';
          return;
        }
        el.innerHTML = bookings.map(b => `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
              <strong>${escapeHtml(b.rego)}</strong>
              ${b.vehicleMake || b.vehicleModel ? `<span class="text-muted"> — ${escapeHtml(b.vehicleMake)} ${escapeHtml(b.vehicleModel)}</span>` : ''}
              <div class="small text-muted">${escapeHtml(b.dateIn)} ${escapeHtml(b.timeIn || '')} → ${escapeHtml(b.dateOut)} ${escapeHtml(b.timeOut || '')}</div>
            </div>
            <div>${statusBadge(b.status)}</div>
          </div>
        `).join('');
      } catch (e) {
        el.textContent = 'Could not load bookings.';
      }
    }

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await fetch('/api/customer-auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/portal/login.html';
    });
  </script>
</body>
</html>
