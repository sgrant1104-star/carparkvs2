<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - BOI Car Storage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <style>
    .portal-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      padding: 1.25rem 1.5rem;
    }
    .portal-body { max-width: 640px; margin: 2.5rem auto; padding: 0 1rem; }
  </style>
</head>
<body>
  <div class="portal-header d-flex justify-content-between align-items-center">
    <div><i class="bi bi-p-square-fill me-2"></i><strong>BOI Car Storage</strong></div>
    <button class="btn btn-sm btn-outline-light" id="btn-logout">
      <i class="bi bi-box-arrow-right me-1"></i>Sign out
    </button>
  </div>

  <div class="portal-body">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1">Welcome, <span id="customer-name">…</span></h4>
        <p class="text-muted mb-4" id="customer-email"></p>
        <div class="alert alert-info mb-0">
          <i class="bi bi-info-circle me-2"></i>
          Online booking is coming soon — you'll be able to book your parking right here.
        </div>
      </div>
    </div>
  </div>

  <script>
    fetch('/api/customer-auth/me', { credentials: 'include' }).then(async (r) => {
      if (!r.ok) { window.location.href = '/portal/login.html'; return; }
      const c = await r.json();
      document.getElementById('customer-name').textContent = `${c.firstName} ${c.lastName}`;
      document.getElementById('customer-email').textContent = c.email;
    }).catch(() => { window.location.href = '/portal/login.html'; });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await fetch('/api/customer-auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/portal/login.html';
    });
  </script>
</body>
</html>
