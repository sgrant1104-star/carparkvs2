<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Bookings - Carpark Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="page-container">
    <div class="page-header">
      <h2><i class="bi bi-inbox me-2"></i>Pre-Bookings</h2>
    </div>

    <div id="prebookings-summary" class="alert alert-info small mb-3">
      Loading...
    </div>

    <div class="btn-group btn-group-sm mb-3 flex-wrap" role="group" id="pb-filters">
      <button type="button" class="btn btn-outline-primary active" data-filter="all">All</button>
      <button type="button" class="btn btn-outline-primary" data-filter="pending">Awaiting accept <span class="badge bg-warning text-dark" id="cnt-pending">0</span></button>
      <button type="button" class="btn btn-outline-primary" data-filter="today">Arriving today <span class="badge bg-info text-dark" id="cnt-today">0</span></button>
      <button type="button" class="btn btn-outline-primary" data-filter="overdue">Overdue <span class="badge bg-danger" id="cnt-overdue">0</span></button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Type</th>
            <th>Phone</th>
            <th>Rego</th>
            <th>Vehicle</th>
            <th>Drop-off</th>
            <th>Pick-up</th>
            <th>Status</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="prebookings-tbody">
          <tr><td colspan="10" class="text-center py-4"><div class="spinner-border"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit booking modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Booking <span class="text-muted small" id="edit-customer"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          <div class="alert alert-warning small py-2 mb-3 d-none" id="edit-confirmed-note">
            This booking is already confirmed — if you change the dates or times, the customer is emailed the updated details.
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Rego</label>
              <input type="text" class="form-control text-uppercase" id="edit-rego">
            </div>
            <div class="col-md-4">
              <label class="form-label">Phone</label>
              <input type="text" class="form-control" id="edit-phone">
            </div>
            <div class="col-md-4">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="edit-email">
            </div>
            <div class="col-md-4">
              <label class="form-label">Make</label>
              <input type="text" class="form-control" id="edit-make">
            </div>
            <div class="col-md-4">
              <label class="form-label">Model</label>
              <input type="text" class="form-control" id="edit-model">
            </div>
            <div class="col-md-4">
              <label class="form-label">Colour</label>
              <input type="text" class="form-control" id="edit-color">
            </div>
            <div class="col-md-6">
              <label class="form-label">Drop-off date</label>
              <input type="date" class="form-control" id="edit-date-in">
            </div>
            <div class="col-md-6">
              <label class="form-label">Drop-off time</label>
              <input type="time" class="form-control" id="edit-time-in">
            </div>
            <div class="col-md-6">
              <label class="form-label">Pick-up date</label>
              <input type="date" class="form-control" id="edit-date-out">
            </div>
            <div class="col-md-6">
              <label class="form-label">Pick-up time</label>
              <input type="time" class="form-control" id="edit-time-out">
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" id="edit-notes" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" id="btn-save-edit">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <div id="alert-container" class="alert-banner"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar('prebookings');

    let allBookings = [];
    let currentFilter = 'all';

    function matchesFilter(b) {
      if (currentFilter === 'pending') return b.status === 'pending';
      if (currentFilter === 'today') return b.arrivingToday;
      if (currentFilter === 'overdue') return b.overdue;
      return true;
    }

    function statusCell(b) {
      return b.status === 'confirmed'
        ? '<span class="badge bg-success">Confirmed</span>'
        : '<span class="badge bg-warning text-dark">Awaiting accept</span>';
    }

    function renderTable() {
      const tbody = document.getElementById('prebookings-tbody');
      const rows = allBookings.filter(matchesFilter);
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center text-muted py-4">${allBookings.length === 0 ? 'No pending bookings.' : 'Nothing matches this filter.'}</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(b => {
        const vehicle = [b.vehicleMake, b.vehicleModel, b.vehicleColor].filter(Boolean).join(' ') || '—';
        const rowClass = b.overdue ? 'table-warning' : (b.arrivingToday ? 'table-info' : '');
        return `
          <tr class="${rowClass}">
            <td>${escapeHtml(b.firstName)} ${escapeHtml(b.lastName)}</td>
            <td>
              ${b.isLongTerm ? '<span class="badge bg-info text-dark d-block mb-1">Long-term</span>' : ''}
              ${b.accountCompanyName ? `<span class="badge bg-secondary d-block">On account: ${escapeHtml(b.accountCompanyName)}</span>` : ''}
              ${!b.isLongTerm && !b.accountCompanyName ? '<span class="text-muted small">Standard</span>' : ''}
            </td>
            <td>${escapeHtml(b.phone || '—')}</td>
            <td class="fw-bold">${escapeHtml(b.rego)}</td>
            <td>${escapeHtml(vehicle)}</td>
            <td>${escapeHtml(String(b.dateIn).slice(0, 10))} ${escapeHtml(b.timeIn || '')}
              ${b.overdue ? '<span class="badge bg-danger ms-1">Overdue</span>' : ''}
              ${b.arrivingToday ? '<span class="badge bg-primary ms-1">Today</span>' : ''}</td>
            <td>${escapeHtml(String(b.dateOut).slice(0, 10))} ${escapeHtml(b.timeOut || '')}</td>
            <td>${statusCell(b)}</td>
            <td class="small text-muted" style="max-width:220px;">${escapeHtml(b.notes || '')}</td>
            <td class="text-end text-nowrap">
              ${b.status === 'pending' ? `
                <button class="btn btn-sm btn-primary btn-accept" data-id="${b.id}" title="Confirm this booking and email the customer">
                  <i class="bi bi-check-lg me-1"></i>Accept
                </button>` : ''}
              <a href="/invoice.html?prebooking=${b.id}" class="btn btn-sm btn-success" title="Customer has arrived — check them in">
                <i class="bi bi-box-arrow-in-right me-1"></i>Allocate
              </a>
              <button class="btn btn-sm btn-outline-secondary btn-edit" data-id="${b.id}" title="Edit this booking">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-secondary btn-no-show" data-id="${b.id}" title="Customer never turned up">
                <i class="bi bi-person-x"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger btn-cancel-prebooking" data-id="${b.id}" title="Cancel this booking">
                <i class="bi bi-x-lg"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('.btn-accept').forEach((btn) => {
        btn.addEventListener('click', () => acceptBooking(btn));
      });
      document.querySelectorAll('.btn-edit').forEach((btn) => {
        btn.addEventListener('click', () => openEdit(btn.dataset.id));
      });
      document.querySelectorAll('.btn-cancel-prebooking').forEach((btn) => {
        btn.addEventListener('click', () => actOnPrebooking(btn, 'cancel', 'Cancel this booking? The customer will be emailed.'));
      });
      document.querySelectorAll('.btn-no-show').forEach((btn) => {
        btn.addEventListener('click', () => actOnPrebooking(btn, 'no-show', 'Mark this booking as a no-show? The customer will be emailed.'));
      });
    }

    async function loadPrebookings() {
      const res = await fetch('/api/prebookings');
      if (!res.ok) return;
      allBookings = await res.json();

      const pending = allBookings.filter(b => b.status === 'pending').length;
      const today = allBookings.filter(b => b.arrivingToday).length;
      const overdue = allBookings.filter(b => b.overdue).length;
      document.getElementById('cnt-pending').textContent = pending;
      document.getElementById('cnt-today').textContent = today;
      document.getElementById('cnt-overdue').textContent = overdue;

      const summary = document.getElementById('prebookings-summary');
      if (allBookings.length === 0) {
        summary.className = 'alert alert-success small mb-3';
        summary.textContent = 'No pending bookings — all caught up.';
      } else {
        const parts = [`${allBookings.length} upcoming booking${allBookings.length === 1 ? '' : 's'}`];
        if (pending) parts.push(`${pending} awaiting accept`);
        if (today) parts.push(`${today} arriving today`);
        if (overdue) parts.push(`${overdue} overdue (drop-off date has passed)`);
        summary.className = `alert ${overdue > 0 ? 'alert-warning' : (pending > 0 ? 'alert-info' : 'alert-success')} small mb-3`;
        summary.textContent = parts.join(' · ');
      }

      renderTable();
      if (typeof updatePrebookingBadge === 'function') updatePrebookingBadge();
    }

    async function acceptBooking(btn) {
      btn.disabled = true;
      try {
        const res = await fetch(`/api/prebookings/${btn.dataset.id}/accept`, { method: 'POST' });
        if (res.ok) {
          showAlert('Booking accepted — the customer has been emailed their confirmation.', 'success', 5000);
          loadPrebookings();
        } else {
          const data = await res.json().catch(() => ({}));
          showAlert(data.error || 'Could not accept booking', 'danger');
          btn.disabled = false;
        }
      } catch (e) {
        showAlert('Connection error. Please try again.', 'danger');
        btn.disabled = false;
      }
    }

    async function actOnPrebooking(btn, action, confirmMsg) {
      if (!confirm(confirmMsg)) return;
      btn.disabled = true;
      try {
        const res = await fetch(`/api/prebookings/${btn.dataset.id}/${action}`, { method: 'POST' });
        if (res.ok) {
          loadPrebookings();
        } else {
          const data = await res.json().catch(() => ({}));
          showAlert(data.error || 'Action failed', 'danger');
          btn.disabled = false;
        }
      } catch (e) {
        showAlert('Connection error. Please try again.', 'danger');
        btn.disabled = false;
      }
    }

    function openEdit(id) {
      const b = allBookings.find(x => String(x.id) === String(id));
      if (!b) return;
      document.getElementById('edit-id').value = b.id;
      document.getElementById('edit-customer').textContent = `— ${b.firstName} ${b.lastName}`;
      document.getElementById('edit-rego').value = b.rego || '';
      document.getElementById('edit-phone').value = b.phone || '';
      document.getElementById('edit-email').value = b.email || '';
      document.getElementById('edit-make').value = b.vehicleMake || '';
      document.getElementById('edit-model').value = b.vehicleModel || '';
      document.getElementById('edit-color').value = b.vehicleColor || '';
      document.getElementById('edit-date-in').value = String(b.dateIn).slice(0, 10);
      document.getElementById('edit-time-in').value = b.timeIn || '';
      document.getElementById('edit-date-out').value = String(b.dateOut).slice(0, 10);
      document.getElementById('edit-time-out').value = b.timeOut || '';
      document.getElementById('edit-notes').value = b.notes || '';
      document.getElementById('edit-confirmed-note').classList.toggle('d-none', b.status !== 'confirmed');
      new bootstrap.Modal('#editModal').show();
    }

    document.getElementById('btn-save-edit').addEventListener('click', async () => {
      const id = document.getElementById('edit-id').value;
      const payload = {
        rego: document.getElementById('edit-rego').value,
        phone: document.getElementById('edit-phone').value,
        email: document.getElementById('edit-email').value,
        vehicleMake: document.getElementById('edit-make').value,
        vehicleModel: document.getElementById('edit-model').value,
        vehicleColor: document.getElementById('edit-color').value,
        dateIn: document.getElementById('edit-date-in').value,
        timeIn: document.getElementById('edit-time-in').value,
        dateOut: document.getElementById('edit-date-out').value,
        timeOut: document.getElementById('edit-time-out').value,
        notes: document.getElementById('edit-notes').value,
      };
      const res = await fetch(`/api/prebookings/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { showAlert(data.error || 'Could not save changes', 'danger'); return; }
      bootstrap.Modal.getInstance('#editModal').hide();
      showAlert(data.customerEmailed ? 'Booking updated — the customer has been emailed the new details.' : 'Booking updated', 'success', 5000);
      loadPrebookings();
    });

    document.querySelectorAll('#pb-filters button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#pb-filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTable();
      });
    });

    async function init() {
      await checkAuth();
      await loadPrebookings();
      updateNavCarsCount();
    }
    init();
  </script>
</body>
</html>
